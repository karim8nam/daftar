<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://lrpdkdrenfagfhfdndlx.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مناديب اميك">
<title>مناديب اميك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div id="loginScreen" class="screen hidden">
  <div class="login-box">
    <div class="brand"><div class="mark">ا</div><div><h1>مناديب اميك</h1><p>ادخل باسم الدخول والباسورد اللي المصنع بعتهملك</p></div></div>
    <form id="loginForm" autocomplete="on">
      <label>اسم الدخول<input id="loginUser" type="text" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label>الباسورد<input id="loginPass" type="password" dir="ltr" autocomplete="current-password" required></label>
      <div id="loginError" class="error hidden"></div>
      <button class="primary big" type="submit" id="loginBtn">دخول</button>
    </form>
  </div>
</div>

<div id="lockScreen" class="screen lock-screen hidden">
  <div class="login-box">
    <div class="brand"><div class="mark">ا</div><div><h1>مناديب اميك</h1><p id="lockWho"></p></div></div>
    <form id="lockForm" autocomplete="off">
      <div class="note">🔒 الصفحة اتقفلت — اكتب باسورد الفتح بتاعك (6 أرقام). اللي كنت بتكتبه زي ما هو.</div>
      <label>باسورد الفتح<input id="lockPin" class="pin" type="password" inputmode="numeric" dir="ltr" maxlength="6" autocomplete="off" spellcheck="false"></label>
      <div id="lockError" class="error hidden"></div>
      <button class="primary big" type="submit" id="lockBtn">🔓 فتح</button>
      <button class="secondary" type="button" id="lockLogout">خروج من الحساب</button>
    </form>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <header class="top">
    <div class="who"><b id="repName"></b><small id="factoryLine"></small></div>
    <button type="button" class="icon-btn" id="refreshBtn" aria-label="تحديث" title="تحديث">🔄</button>
    <button type="button" class="icon-btn" id="logoutBtn" aria-label="خروج" title="خروج">⏻</button>
  </header>
  <div id="netBar" class="net-bar hidden"></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="home" class="active"><span>🏠</span>الرئيسية</button>
    <button type="button" data-tab="order"><span>➕</span>طلب</button>
    <button type="button" data-tab="samples"><span>🧪</span>عينات</button>
    <button type="button" data-tab="customers"><span>👥</span>العملاء</button>
    <button type="button" data-tab="prices"><span>💲</span>الأسعار</button>
    <button type="button" data-tab="month"><span>📅</span>الشهر</button>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="portal.js"></script>
</body>
</html>
